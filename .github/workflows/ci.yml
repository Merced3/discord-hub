# CI — calls the shared checklist defined once in Merced3/automations
# (.github/workflows/python-checks.yml). Change it there, not here.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    uses: Merced3/automations-ci/.github/workflows/python-checks.yml@main
    secrets:
      AUTOMATIONS_PAT: ${{ secrets.AUTOMATIONS_PAT }}
