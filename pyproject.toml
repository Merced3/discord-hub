[project]
name = "discord-hub"
version = "0.1.0"
description = "Single always-on Discord connection and local API for all projects"
requires-python = ">=3.13"
dependencies = [
    "automation-harness",
    "davey>=0.1.4",
    "discord.py>=2.7",
    # Voice receive with inbound DAVE decryption. Pinned to PR #58 branch
    # until a voice-recv release ships DAVE support (ADR 0005).
    "discord-ext-voice-recv @ git+https://github.com/porgeeratad/discord-ext-voice-recv@dave-decrypt",
    "fastapi>=0.115",
    "pynacl>=1.5",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_hub"]
