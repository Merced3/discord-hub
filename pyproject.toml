[project]
name = "discord-hub"
version = "0.1.0"
description = "Single always-on Discord connection and local API for all projects"
requires-python = ">=3.13"
dependencies = [
    "automation-harness",
    "davey>=0.1.4",
    "discord.py>=2.7",
    "fastapi>=0.115",
    "pynacl>=1.5",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_hub"]
