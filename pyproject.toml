[project]
name = "discord-hub"
version = "0.1.0.dev0"
description = "Single always-on Discord connection and local API for all projects"
requires-python = ">=3.13"
dependencies = [
    "automation-harness",
    "discord.py>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_hub"]
